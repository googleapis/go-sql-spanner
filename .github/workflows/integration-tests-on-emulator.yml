on:
  push:
    branches: [ main ]
  pull_request:

name: Integration tests on emulator

permissions:
  contents: read

jobs:
  # This is the original job, renamed for clarity
  test-go:
    name: Go Integration Tests
    runs-on: ubuntu-latest
    services:
      emulator:
        image: gcr.io/cloud-spanner-emulator/emulator:latest # zizmor: ignore[unpinned-images]
        ports:
          - 9010:9010
          - 9020:9020
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
      - name: Run Go integration tests on emulator
        run: go test -race
        env:
          JOB_TYPE: test
          SPANNER_EMULATOR_HOST: localhost:9010
          SPANNER_TEST_PROJECT: emulator-test-project
          SPANNER_TEST_INSTANCE: test-instance

  test-ruby:
    name: Ruby Integration Tests
    runs-on: ubuntu-latest
    services:
      emulator:
        image: gcr.io/cloud-spanner-emulator/emulator:latest # zizmor: ignore[unpinned-images]
        ports:
          - 9010:9010
          - 9020:9020
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Ruby
        uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: '4.0.9'
          working-directory: spannerlib/wrappers/spannerlib-ruby
          bundler-cache: true
      - name: Compile and Run Ruby Integration Tests
        working-directory: spannerlib/wrappers/spannerlib-ruby
        env:
          SPANNER_EMULATOR_HOST: localhost:9010
        run: |
          bundle exec rake compile:x86_64-linux
          bundle exec rspec spec/integration/
