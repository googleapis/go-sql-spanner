# .github/workflows/lint.yml

name: RuboCop Linter

permissions:
  contents: read

on:
  push:
    branches:
      - main  
  pull_request:
    
jobs:
  ruby-wrapper-lint:
    runs-on: ubuntu-latest 

    defaults:
      run:
        working-directory: spannerlib/wrappers/spannerlib-ruby
    
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Ruby
        uses: ruby/setup-ruby@b3aaceaef7e0ee231b499e7b5f49c03fc1d32199 # v1.338.0
        with:
          ruby-version: '4.0.9'       
          bundler-cache: true 
          working-directory: spannerlib/wrappers/spannerlib-ruby 

      - name: Run RuboCop
        run: bundle exec rubocop
