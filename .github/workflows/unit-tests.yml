on:
  push:
    branches: [ main ]
  pull_request:
name: Unit Tests

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        go-version: [1.25.x, 1.26.x]
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - name: Run unit tests
        run: go test -race -short
      - name: Run connection state unit tests
        run: go test -race -short
        working-directory: connectionstate
      - name: Run parser unit tests
        run: go test -race -short
        working-directory: parser

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.x
          cache-dependency-path: |
            go.sum
            examples/go.sum
            snippets/go.sum
            benchmarks/go.sum

      - name: Install tools
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: vet .
        run: go vet ./...

      - name: vet ./examples
        working-directory: ./examples
        run: go vet ./...

      - name: vet ./snippets
        working-directory: ./snippets
        run: go vet ./...

      - name: vet ./benchmarks
        working-directory: ./benchmarks
        run: go vet ./...

      - name: gofmt
        run: |
          OUT=$(gofmt -s -d .)
          if [ -n "$OUT" ]; then
            echo -e "$OUT"
            echo "Code unformatted, please run 'gofmt -w -s .'"
            exit 1
          fi

      - name: staticcheck .
        run: staticcheck ./...

      - name: staticcheck ./examples
        working-directory: ./examples
        run: staticcheck ./...

      - name: staticcheck ./benchmarks
        working-directory: ./benchmarks
        run: staticcheck ./...
