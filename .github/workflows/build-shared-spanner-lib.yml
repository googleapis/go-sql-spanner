name: Build Shared SpannerLib

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      matrix:
        go-version: ['1.27.x']
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: ubuntu-latest
            target: linux
          - os: macos-latest
            target: macos
          - os: windows-latest
            target: windows

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ matrix.go-version }}
        cache-dependency-path: spannerlib/go.sum

    - name: Install Dependencies (Linux)
      if: matrix.target == 'linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y gcc-aarch64-linux-gnu

    - name: Build Binaries
      shell: bash
      run: |
        cd spannerlib/shared
        if [ "${{ matrix.target }}" == "linux" ]; then
          export SKIP_MACOS=true
          export SKIP_WINDOWS=true
          # Enable ARM64 build
          export BUILD_LINUX_ARM64=true
          export CC_LINUX_ARM64=aarch64-linux-gnu-gcc
        elif [ "${{ matrix.target }}" == "macos" ]; then
          export SKIP_LINUX=true
          export SKIP_WINDOWS=true
          # Enable AMD64 build (if possible)
          export BUILD_MACOS_AMD64=true
        elif [ "${{ matrix.target }}" == "windows" ]; then
          export SKIP_LINUX=true
          export SKIP_MACOS=true
        fi
        ./build-binaries.sh

    - name: Upload Artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: spannerlib-binaries-${{ matrix.target }}
        path: spannerlib/shared/binaries/
