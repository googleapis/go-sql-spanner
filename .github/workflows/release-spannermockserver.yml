name: Release spannermockserver

on:
  push:
    tags:
      - 'spannermockserver-v*'
  workflow_dispatch:

jobs:
  build-and-publish:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/spannermockserver
    permissions:
      id-token: write
      contents: read

    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.15"

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Build package
      working-directory: spannerlib/wrappers/spannerlib-python/spannermockserver
      run: python -m build

    - name: Check package
      working-directory: spannerlib/wrappers/spannerlib-python/spannermockserver
      run: twine check dist/*

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
      with:
        packages-dir: spannerlib/wrappers/spannerlib-python/spannermockserver/dist/
        verbose: true
